[project]
name = "domnir-feasibility"
version = "0.1.0"
description = "Local feasibility checks for Dómnir"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mujoco==3.3.7",
    "numpy==2.5.4",
    "pydantic>=2.0",
    "rfc8785>=0.1.4",
    "cryptography>=43.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
