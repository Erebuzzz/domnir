<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="aegis-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold-core-hd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="carbon-arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Containment Telemetry Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Boundary Ticks at 45-degree intervals -->
  <line x1="60" y1="4" x2="60" y2="8" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="60" y1="112" x2="60" y2="116" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="4" y1="60" x2="8" y2="60" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="112" y1="60" x2="116" y2="60" stroke="#00f0ff" stroke-width="1.5" />

  <!-- Diagonal Quadrotor Carbon Struts (X-Frame) -->
  <line x1="28" y1="28" x2="92" y2="92" stroke="url(#carbon-arm)" stroke-width="4" stroke-linecap="round" />
  <line x1="28" y1="92" x2="92" y2="28" stroke="url(#carbon-arm)" stroke-width="4" stroke-linecap="round" />

  <!-- Cardinal Staves of the Aegishjalmur (Helm of Awe) -->
  <!-- North Stave -->
  <line x1="60" y1="36" x2="60" y2="12" stroke="url(#aegis-neon)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 52 22 L 60 16 L 68 22" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 50 30 L 60 24 L 70 30" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- South Stave -->
  <line x1="60" y1="84" x2="60" y2="108" stroke="url(#aegis-neon)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 52 98 L 60 104 L 68 98" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 50 90 L 60 96 L 70 90" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- West Stave -->
  <line x1="36" y1="60" x2="12" y2="60" stroke="url(#aegis-neon)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 22 52 L 16 60 L 22 68" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 30 50 L 24 60 L 30 70" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- East Stave -->
  <line x1="84" y1="60" x2="108" y2="60" stroke="url(#aegis-neon)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 98 52 L 104 60 L 98 68" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 90 50 L 96 60 L 90 70" fill="none" stroke="url(#aegis-neon)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Four Drone Rotor Hubs & Propeller Sweep Rings -->
  <!-- Top-Left Rotor (M4) -->
  <circle cx="28" cy="28" r="14" fill="url(#hub-glow)" />
  <circle cx="28" cy="28" r="11" fill="#0b0f19" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="28" cy="28" r="3.5" fill="#38bdf8" />
  <line x1="18" y1="28" x2="38" y2="28" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Top-Right Rotor (M1) -->
  <circle cx="92" cy="28" r="14" fill="url(#hub-glow)" />
  <circle cx="92" cy="28" r="11" fill="#0b0f19" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="92" cy="28" r="3.5" fill="#38bdf8" />
  <line x1="82" y1="28" x2="102" y2="28" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom-Left Rotor (M3) -->
  <circle cx="28" cy="92" r="14" fill="url(#hub-glow)" />
  <circle cx="28" cy="92" r="11" fill="#0b0f19" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="28" cy="92" r="3.5" fill="#38bdf8" />
  <line x1="18" y1="92" x2="38" y2="92" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom-Right Rotor (M2) -->
  <circle cx="92" cy="92" r="14" fill="url(#hub-glow)" />
  <circle cx="92" cy="92" r="11" fill="#0b0f19" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="92" cy="92" r="3.5" fill="#38bdf8" />
  <line x1="82" y1="92" x2="102" y2="92" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Centerpiece: Inertial State Core (Gold Runic Diamond) -->
  <polygon points="60,46 74,60 60,74 46,60" fill="#070a11" stroke="url(#gold-core-hd)" stroke-width="2.5" />
  <polygon points="60,51 69,60 60,69 51,60" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <circle cx="60" cy="60" r="4" fill="#00f0ff" />
</svg>
