<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Step 1: Mission Target Envelope Icon -->
    <symbol id="icon-mission" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 19 6 22 12 19 18 12 22 5 18 2 12 5 6" />
      <circle cx="12" cy="12" r="3" fill="currentColor" fill-opacity="0.2" />
      <line x1="12" y1="5" x2="12" y2="8" stroke-width="1.5" />
      <line x1="12" y1="16" x2="12" y2="19" stroke-width="1.5" />
      <line x1="5" y1="12" x2="8" y2="12" stroke-width="1.5" />
      <line x1="16" y1="12" x2="19" y2="12" stroke-width="1.5" />
    </symbol>

    <!-- Step 2: AI Controller Synthesis Icon -->
    <symbol id="icon-controller" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 21 7 21 17 12 22 3 17 3 7" />
      <polygon points="12 6 17 9 17 15 12 18 7 15 7 9" />
      <circle cx="12" cy="12" r="1.5" fill="currentColor" />
      <line x1="12" y1="2" x2="12" y2="6" stroke-width="1.4" />
      <line x1="12" y1="18" x2="12" y2="22" stroke-width="1.4" />
      <line x1="3" y1="7" x2="7" y2="9" stroke-width="1.4" />
      <line x1="17" y1="15" x2="21" y2="17" stroke-width="1.4" />
    </symbol>

    <!-- Step 3: Isolated MicroVM Cage Icon -->
    <symbol id="icon-sandbox" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" />
      <line x1="12" y1="2" x2="12" y2="22" stroke-width="1.2" stroke-dasharray="2 2" />
      <line x1="2" y1="8.5" x2="22" y2="15.5" stroke-width="1.2" stroke-dasharray="2 2" />
      <line x1="2" y1="15.5" x2="22" y2="8.5" stroke-width="1.2" stroke-dasharray="2 2" />
      <circle cx="12" cy="12" r="2" fill="currentColor" />
    </symbol>

    <!-- Step 4: Live Flight Simulation & Replay Icon -->
    <symbol id="icon-run" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10" />
    </symbol>

    <!-- Court Record Verifier Icon -->
    <symbol id="icon-verifier" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 21 7 21 17 12 22 3 17 3 7" />
      <polyline points="8 12 11 15 16 9" stroke-width="2.2" />
    </symbol>

    <!-- Containment Shield Icon -->
    <symbol id="icon-shield" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 20 5 20 11 12 22 4 11 4 5" />
      <line x1="12" y1="2" x2="12" y2="22" stroke-width="1.2" opacity="0.5" />
      <path d="M8 8l4 3 4-3" stroke-width="1.2" opacity="0.6" />
    </symbol>

    <!-- Documentation Codex Icon -->
    <symbol id="icon-docs" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4 4 12 2 20 4 20 20 12 18 4 20" />
      <line x1="12" y1="2" x2="12" y2="18" />
      <path d="M6 8l4-1m-4 5l4-1m6-3l4 1m-4 4l4 1" stroke-width="1.2" opacity="0.5" />
    </symbol>

    <!-- Faceted Search Oracle Icon -->
    <symbol id="icon-search" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 3 16 6 18 11 16 16 11 19 6 16 4 11 6 6" />
      <line x1="16" y1="16" x2="22" y2="22" stroke-width="2.2" />
      <circle cx="11" cy="11" r="2" fill="currentColor" fill-opacity="0.4" />
    </symbol>

    <!-- Faceted Code Copy Icon -->
    <symbol id="icon-copy" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="13" height="13" rx="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </symbol>

    <!-- Check Circle / Matched Icon -->
    <symbol id="icon-check" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </symbol>

    <!-- Faceted Celestial Star / Theme Switcher -->
    <symbol id="icon-theme" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9" fill="currentColor" fill-opacity="0.25" />
    </symbol>

    <!-- Replay Loop Icon -->
    <symbol id="icon-replay" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2 5 2 11 8 11" />
      <path d="M4.5 16a9 9 0 1 0 2.2-9.5L2 11" />
    </symbol>

    <!-- Download Artifact Icon -->
    <symbol id="icon-download" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </symbol>

    <!-- Alert Triangle Icon -->
    <symbol id="icon-alert" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 3 22 21 2 21" />
      <line x1="12" y1="9" x2="12" y2="14" />
      <circle cx="12" cy="18" r="0.8" fill="currentColor" />
    </symbol>

    <!-- 3D Play Icon -->
    <symbol id="icon-play" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6 4 20 12 6 20 6 4" fill="currentColor" fill-opacity="0.3" />
    </symbol>

    <!-- 3D Pause Icon -->
    <symbol id="icon-pause" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="4" height="16" rx="1" fill="currentColor" fill-opacity="0.3" />
      <rect x="15" y="4" width="4" height="16" rx="1" fill="currentColor" fill-opacity="0.3" />
    </symbol>

    <!-- 3D Reset Camera Icon -->
    <symbol id="icon-reset" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 2.6-6.4L2 9" />
      <polyline points="2 3 2 9 8 9" />
    </symbol>

    <!-- Chevron Right for View Switcher -->
    <symbol id="icon-chevron-right" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </symbol>

    <!-- 4-Grid Matrix for All Steps View -->
    <symbol id="icon-grid" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1" />
      <rect x="14" y="3" width="7" height="7" rx="1" />
      <rect x="14" y="14" width="7" height="7" rx="1" />
      <rect x="3" y="14" width="7" height="7" rx="1" />
    </symbol>
  </defs>
</svg>
