<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aegis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gold-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Shield Container -->
  <rect width="64" height="64" rx="14" fill="#070a11" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Containment Boundary Ward -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Diagonal Quadrotor Carbon Struts (X-Frame) -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="48" x2="48" y2="16" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Cardinal Staves of the Aegishjalmur (Helm of Awe) -->
  <!-- North Stave & Trident Cross-Tines -->
  <line x1="32" y1="18" x2="32" y2="6" stroke="url(#aegis-grad)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 28 11 L 32 8 L 36 11 M 27 15 L 32 12 L 37 15" fill="none" stroke="url(#aegis-grad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- South Stave & Trident Cross-Tines -->
  <line x1="32" y1="46" x2="32" y2="58" stroke="url(#aegis-grad)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 28 53 L 32 56 L 36 53 M 27 49 L 32 52 L 37 49" fill="none" stroke="url(#aegis-grad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- West Stave & Trident Cross-Tines -->
  <line x1="18" y1="32" x2="6" y2="32" stroke="url(#aegis-grad)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 11 28 L 8 32 L 11 36 M 15 27 L 12 32 L 15 37" fill="none" stroke="url(#aegis-grad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- East Stave & Trident Cross-Tines -->
  <line x1="46" y1="32" x2="58" y2="32" stroke="url(#aegis-grad)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 53 28 L 56 32 L 53 36 M 49 27 L 52 32 L 49 37" fill="none" stroke="url(#aegis-grad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Four Drone Rotor Hubs & Propeller Sweep Rings -->
  <!-- Top-Left Rotor -->
  <circle cx="16" cy="16" r="6" fill="#090d16" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="16" cy="16" r="2" fill="#38bdf8" />
  <line x1="11" y1="16" x2="21" y2="16" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Top-Right Rotor -->
  <circle cx="48" cy="16" r="6" fill="#090d16" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="48" cy="16" r="2" fill="#38bdf8" />
  <line x1="43" y1="16" x2="53" y2="16" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Bottom-Left Rotor -->
  <circle cx="16" cy="48" r="6" fill="#090d16" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="16" cy="48" r="2" fill="#38bdf8" />
  <line x1="11" y1="48" x2="21" y2="48" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Bottom-Right Rotor -->
  <circle cx="48" cy="48" r="6" fill="#090d16" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="48" cy="48" r="2" fill="#38bdf8" />
  <line x1="43" y1="48" x2="53" y2="48" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Inner Inertial Measurement Core (Gold Diamond & Telemetry Node) -->
  <polygon points="32,25 39,32 32,39 25,32" fill="#111827" stroke="url(#gold-core)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3" fill="#00f0ff" />
</svg>
