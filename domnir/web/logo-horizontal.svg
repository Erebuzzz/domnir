<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <linearGradient id="hz-aegis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="hz-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (x=30, y=30, r=26) -->
  <g transform="translate(4, 4)">
    <circle cx="26" cy="26" r="25" fill="#070a11" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="26" cy="26" r="22" fill="none" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5" />

    <!-- X-Arms -->
    <line x1="12" y1="12" x2="40" y2="40" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="40" x2="40" y2="12" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Cardinal Aegishjalmur Staves -->
    <line x1="26" y1="15" x2="26" y2="4" stroke="url(#hz-aegis)" stroke-width="1.75" stroke-linecap="round" />
    <path d="M 23 8 L 26 5 L 29 8" fill="none" stroke="url(#hz-aegis)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <line x1="26" y1="37" x2="26" y2="48" stroke="url(#hz-aegis)" stroke-width="1.75" stroke-linecap="round" />
    <path d="M 23 44 L 26 47 L 29 44" fill="none" stroke="url(#hz-aegis)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <line x1="15" y1="26" x2="4" y2="26" stroke="url(#hz-aegis)" stroke-width="1.75" stroke-linecap="round" />
    <path d="M 8 23 L 5 26 L 8 29" fill="none" stroke="url(#hz-aegis)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <line x1="37" y1="26" x2="48" y2="26" stroke="url(#hz-aegis)" stroke-width="1.75" stroke-linecap="round" />
    <path d="M 44 23 L 47 26 L 44 29" fill="none" stroke="url(#hz-aegis)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rotors -->
    <circle cx="12" cy="12" r="5" fill="#0b0f19" stroke="#00f0ff" stroke-width="1" />
    <circle cx="40" cy="12" r="5" fill="#0b0f19" stroke="#00f0ff" stroke-width="1" />
    <circle cx="12" cy="40" r="5" fill="#0b0f19" stroke="#00f0ff" stroke-width="1" />
    <circle cx="40" cy="40" r="5" fill="#0b0f19" stroke="#00f0ff" stroke-width="1" />

    <!-- Core -->
    <polygon points="26,20 32,26 26,32 20,26" fill="#0f172a" stroke="url(#hz-gold)" stroke-width="1.5" />
    <circle cx="26" cy="26" r="2.5" fill="#00f0ff" />
  </g>

  <!-- Typography Block -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#ffffff">DÓMNIR</text>
  <text x="69" y="46" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#38bdf8">BLAST RADIUS ZERO // VULTR</text>
